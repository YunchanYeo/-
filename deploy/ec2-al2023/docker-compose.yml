# 레포 루트 기준 경로. 실행: cd deploy/ec2-al2023 && docker compose up -d --build
# 서버에 레포를 둘 때 경로에 한글·공백은 피하는 것을 권장합니다.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin-web

  admin-web:
    build:
      context: ../../admin-web
      dockerfile: Dockerfile
      args:
        # 비우면 브라우저가 같은 호스트의 /api 로 요청(nginx → backend 프록시)
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend.env
    volumes:
      - backend_data:/app/data

volumes:
  caddy_data:
  caddy_config:
  backend_data:
