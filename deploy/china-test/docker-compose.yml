services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: wechat-backend
    restart: unless-stopped
    env_file:
      - ../../backend/.env
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - backend_data:/app/data
    expose:
      - "3000"
    ports:
      - "3000:3000"

  admin-web:
    build:
      context: ../../admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: wechat-admin-web
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    # 공인 IP:8080 노출 안 함 — 관리자·API·미니프로그램은 모두 https://…(443) → Caddy → 본 컨테이너 80
    # ECS 안에서만 점검할 때: curl http://127.0.0.1:8080/  (cloudflared 등도 동일)
    ports:
      - "127.0.0.1:8080:80"

  # HTTPS: Caddy + Let's Encrypt(ACME). 호스트 80·443 바인딩 — 다른 nginx/Apache 가 80·443 쓰면 중지 후 기동.
  # 인증서는 Caddy가 자동 발급·갱신(/data 볼륨). TLS 동작·DNS 요구는 deploy/china-test/Caddyfile 상단 주석 참고.
  caddy:
    image: caddy:2-alpine
    container_name: wechat-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin-web

  # PostgreSQL (RDS 대신 로컬 테스트가 필요할 때만)
  postgres:
    image: postgres:16-alpine
    container_name: wechat-postgres
    restart: unless-stopped
    profiles: ["pg-local"]
    environment:
      - POSTGRES_DB=wechat
      - POSTGRES_USER=wechat
      - POSTGRES_PASSWORD=change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  backend_data:
  postgres_data:
  caddy_data:
  caddy_config:

